server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'en-tête X-Forwarded-For est ÉCRASÉ par l'IP du pair direct :
        # toute valeur fournie par le client est ignorée (sinon l'attaquant
        # forge une IP neuve à chaque requête et contourne le rate-limit).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
