services:
  backend:
    build: ./backend
    container_name: sd-backend
    restart: unless-stopped
    environment:
      - SD_PORT=${SD_PORT:-8005}
      # SD_DATABASE_URL surchargeable depuis .env (défaut : SQLite du volume)
      - SD_DATABASE_URL=${SD_DATABASE_URL:-sqlite:///./data/staff_delegation.db}
      - SD_SECRET_KEY=${SD_SECRET_KEY:?SD_SECRET_KEY est obligatoire — définissez une clé aléatoire d'au moins 32 caractères (ex. openssl rand -hex 32)}
    volumes:
      - sd-data:/app/data
    networks:
      - sd-net

  frontend:
    build: ./frontend
    container_name: sd-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - sd-net
      - traefik-public
    labels:
      - "traefik.enable=true"
      # Force le réseau pour la découverte Traefik : le frontend est sur
      # sd-net + traefik-public ; sans ce label, Traefik peut résoudre l'IP
      # du réseau privé (sd-net) et ne pas joindre le conteneur (timeout 30s,
      # 504). Vue sur ionos04 lors de la migration depuis ionos05.
      - "traefik.docker.network=traefik-public"
      # HTTP router (redirects to HTTPS)
      - "traefik.http.routers.sd-web.rule=Host(`staffdpapp.cloudfr.net`)"
      - "traefik.http.routers.sd-web.middlewares=sd-redirect"
      - "traefik.http.middlewares.sd-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sd-redirect.redirectscheme.permanent=true"
      # HTTPS router
      - "traefik.http.routers.sd-web-secure.rule=Host(`staffdpapp.cloudfr.net`)"
      - "traefik.http.routers.sd-web-secure.tls=true"
      - "traefik.http.routers.sd-web-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sd-web-secure.service=sd-web"
      # Service
      - "traefik.http.services.sd-web.loadbalancer.server.port=80"

volumes:
  sd-data:

networks:
  sd-net:
  traefik-public:
    external: true
